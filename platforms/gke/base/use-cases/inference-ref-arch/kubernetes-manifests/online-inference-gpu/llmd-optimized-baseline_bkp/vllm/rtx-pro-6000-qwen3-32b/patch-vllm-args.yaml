apiVersion: apps/v1
kind: Deployment
metadata:
  # Targets the exact, prefixed deployment name from the llm-d upstream repo
  name: optimized-baseline-nvidia-gpu-vllm-decode
spec:
  template:
    spec:
      containers:
        - name: modelserver
          # 1. Inject the runtime environment variables into the container
          envFrom:
            - configMapRef:
                name: runtime # Matches the name used in your configMapGenerator
          # 2. Re-map the startup arguments to evaluate those environment variables
          args:
            - "--model=gs://$(MODEL_BUCKET_NAME)/$(MODEL_ID)"
            - "--tensor-parallel-size=$(TENSOR_PARALLEL_SIZE)"
            - "--max-model-len=$(MAX_MODEL_LEN)"
            - "--gpu-memory-utilization=$(GPU_MEMORY_UTILIZATION)"
            - "--served-model-name=$(MODEL_NAME)"
            - "--disable-log-requests"
